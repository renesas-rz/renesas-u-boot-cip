#######################################################################################################################
# Description: Top level GitLab CI yaml file.
#######################################################################################################################
include:
  - project: products/common/bootloader/soc/u-boot-dev-cicd
    ref: "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}_cicd"
    file: renesas-cicd-default.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - project: products/common/bootloader/soc/u-boot-dev-cicd
    ref: $CICD_TARGET_BRANCH
    file: renesas-cicd-default.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "merge_request_event"