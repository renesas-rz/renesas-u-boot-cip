#######################################################################################################################
# Description: Yaml file containing jobs for G3S.
#######################################################################################################################

################################################## include ############################################################
include:
  - local: renesas-cicd/templates/common-job-templates.yml
  - local: renesas-cicd/templates/merge-gateway-job-templates.yml

################################### Preparation job for G3S merge gateway pipeline ####################################
rzg3s-prep-for-uboot-merge-gateway-build-job:
  variables:
    PLAT: "g3s"
  extends:
    - .prep_for_uboot_merge_gateway_build_job_template

############################################ G3S smarc U-Boot build jobs #############################################
rzg3s-smarc:
  variables:
    PLAT: "g3s"
    CONFIG_FILENAME: "smarc-rzg3s_defconfig"
  extends:
    - .mpu_uboot_build_job_template