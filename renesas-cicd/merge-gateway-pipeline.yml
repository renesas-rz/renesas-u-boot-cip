#######################################################################################################################
# Description: Top level yaml file for merge gateway pipelines.
#######################################################################################################################

################################################## include ############################################################
# 1. Including a checkpatch test to be run on the feature branch using the MR target branch as reference.
# 2. Using the MR label to determine what platforms should be tested, and including the MPU build tests for it.
# 3. Either individual platforms or all platforms can be tested.
#    (except n2h and t2h where both the plats would always be tested since they use the same code base)
#######################################################################################################################
include:
  - local: renesas-cicd/plat_jobs/t2n-gitlab-ci.yml
    rules:
      - if: $CI_MERGE_REQUEST_LABELS =~ /t2n/ || $CI_MERGE_REQUEST_LABELS =~ /all_plat/
