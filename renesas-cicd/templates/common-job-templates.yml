#######################################################################################################################
# Description: Yaml file containing templates for jobs common to all pipelines.
#######################################################################################################################

########################################## mpu_uboot_build_job_template ###############################################
# 1. Basic template to build MPU U-Boot.
# 2. All variables listed are required for by the job to be picked up by the correct runner and to build the correct
# config.
# 3. Separate runner for every platform for every pipeline type.
# 4. The artifacts are set to expire in 1 week, as this would help manage storage space efficiently and 1 week is
#    sufficient time for the deletion to not impact any work or testing.
#######################################################################################################################
.mpu_uboot_build_job_template: &mpu_uboot_build_job_template
  stage: mpu_uboot_build_testing
  variables:
    PLAT: ""
    CONFIG_FILENAME: ""
  interruptible: true
  tags:
    - "${PLAT}_${PIPELINE_TYPE}_runner"
  before_script:
    - export CROSS_COMPILE=../compiler/arm-gnu-toolchain-13.2.Rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-
    - make clean
  script:
    - git status
    - |
      run_and_check_error()
      {
        BUILD_COMMAND="$1"
        LOG_FILE="$2"
        eval "$BUILD_COMMAND" 2>&1 | tee "$LOG_FILE"
        if grep -q -i "error:" "$LOG_FILE" && ! grep -q -i "expr: syntax error: unexpected argument" "$LOG_FILE"; then
          echo "ERROR: Unexpected error caused failure."
          exit 1
        fi
      }
    - run_and_check_error "make $CONFIG_FILENAME" "../make_defconfig_log.txt"
    - run_and_check_error "make" "../make_log.txt"
    - |
      if grep -q -i "warning:" "../make_defconfig_log.txt" || grep -q -i "warning:" "../make_log.txt"; then
        echo "WARNING: Unexpected warnings in the log"
        exit 2
      elif grep -q -i "expr: syntax error: unexpected argument" "../make_defconfig_log.txt" || grep -q -i "expr: syntax error: unexpected argument" "../make_log.txt"; then
        echo "WARNING: Unexpected syntax error"
        exit 2
      else
        exit 0
      fi
  allow_failure:
    exit_codes: 2
  artifacts:
    expire_in: 1 week
    when: always
    name: "$CI_JOB_NAME"
    paths:
      - ./u-boot.bin
      - ./u-boot.dtb
      - ./System.map
